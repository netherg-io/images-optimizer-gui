[package]
name = "app"
version = "0.2.0"
description = "Local Windows image optimizer"
authors = ["netherg-io"]
license = "MIT"
repository = "https://github.com/netherg-io/images-optimizer-gui"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
walkdir = "2"
rayon = "1.8"
tempfile = "3.8"
image = "0.24"
mozjpeg = "0.10.13"
webp = "0.3.1"
ravif = "0.11"
imgref = "1.9"
rgb = "0.8"
kamadak-exif = "0.6"
tauri-plugin-dialog = "2"
base64 = "0.22.1"
tokio = "1.49.0"
moka = { version = "0.12.12", features = ["future"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-log = "2"
